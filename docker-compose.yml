version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: fuze-store-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: soketi
      POSTGRES_PASSWORD: soketi_secret
      POSTGRES_DB: soketi
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./setup.sql:/docker-entrypoint-initdb.d/setup.sql
    ports:
      - "5432:5432"
    networks:
      - soketi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soketi"]
      interval: 5s
      timeout: 5s
      retries: 5

  soketi:
    image: quay.io/soketi/soketi:latest
    container_name: fuze-store-soketi
    restart: unless-stopped
    ports:
      - "6001:6001"
    environment:
      SOKETI_DEBUG: false

      # App Manager - PostgreSQL
      # https://docs.soketi.app/app-management/introduction
      SOKETI_APP_MANAGER_DRIVER: "postgres"

      # PostgreSQL connection
      SOKETI_DB_POSTGRES_HOST: "db"
      SOKETI_DB_POSTGRES_PORT: "5432"
      SOKETI_DB_POSTGRES_USERNAME: "soketi"
      SOKETI_DB_POSTGRES_PASSWORD: "soketi_secret"
      SOKETI_DB_POSTGRES_DATABASE: "soketi"
      SOKETI_APP_MANAGER_POSTGRES_TABLE: "websocket_apps"
      SOKETI_APP_MANAGER_POSTGRES_VERSION: "13.3"

      # App Manager Cache (in-memory, per-app)
      SOKETI_APP_MANAGER_CACHE_ENABLED: "true"
      SOKETI_APP_MANAGER_CACHE_TTL: "-1"

      # SSL
      SOKETI_SSL_CERT: ""
      SOKETI_SSL_KEY: ""
      SOKETI_SSL_PASS: ""
      SOKETI_SSL_CA: ""

      # Rate Limiter
      SOKETI_RATE_LIMITER_DRIVER: "local"
      SOKETI_RATE_LIMITER_REDIS_CLUSTER_MODE: "false"

      # Limits
      SOKETI_HTTP_MAX_REQUEST_SIZE: "100"
      SOKETI_EVENT_MAX_CHANNELS_AT_ONCE: "100"
      SOKETI_EVENT_MAX_NAME_LENGTH: "200"
      SOKETI_EVENT_MAX_SIZE_IN_KB: "100"
      SOKETI_EVENT_MAX_BATCH_SIZE: "10"

      SOKETI_CHANNEL_MAX_NAME_LENGTH: "100"

      SOKETI_PRESENCE_MAX_MEMBER_SIZE: "10"
      SOKETI_PRESENCE_MAX_MEMBERS: "100"

      # Webhooks
      SOKETI_WEBHOOKS_BATCHING: "1"
      SOKETI_WEBHOOKS_BATCHING_DURATION: "1000"

      # Default app credentials (used as fallback when DB has no apps)
      SOKETI_DEFAULT_APP_ID: "fuze-store-app-id"
      SOKETI_DEFAULT_APP_KEY: "fuze-store-app-key"
      SOKETI_DEFAULT_APP_SECRET: "fuze-store-app-secret"

      SOKETI_APP_KEY: "fuze-store-app-key"
      SOKETI_APP_ID: "fuze-store-app-id"
      SOKETI_APP_SECRET: "fuze-store-app-secret"
      SOKETI_HOST: "0.0.0.0"
      SOKETI_PORT: 6001

      # https://docs.soketi.app/advanced-usage/graceful-shutdowns
      SOKETI_SHUTDOWN_GRACE_PERIOD: 10000

    depends_on:
      db:
        condition: service_healthy
    networks:
      - soketi-network

volumes:
  db_data:

networks:
  soketi-network:
    driver: bridge
